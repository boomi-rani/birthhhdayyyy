<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oii Lingesh... ❤️</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Trebuchet MS",Arial,sans-serif;
    color:#684f69;
    background:#f8dce9;
}

/* DREAMY BACKGROUND */
.page{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 15% 18%,rgba(255,255,255,.92),transparent 18%),
        radial-gradient(circle at 86% 20%,rgba(255,255,255,.8),transparent 17%),
        radial-gradient(circle at 75% 88%,rgba(255,185,211,.65),transparent 24%),
        linear-gradient(135deg,#f9dce9 0%,#f2e0f4 48%,#dfeaff 100%);
}

.page:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 45%,rgba(255,255,255,.35),transparent 42%);
    pointer-events:none;
}

/* Floating decorations */
.float{
    position:absolute;
    pointer-events:none;
    z-index:1;
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-15px) rotate(5deg)}
}

.heart1{left:8%;top:18%;font-size:30px;color:#ef91b2}
.heart2{right:9%;top:26%;font-size:24px;color:#d9a0cf;animation-delay:1s}
.heart3{left:13%;bottom:17%;font-size:20px;color:#f5b4c9;animation-delay:2s}
.star1{right:16%;bottom:19%;font-size:25px;color:#d2b5e8;animation-delay:.7s}
.star2{left:27%;top:12%;font-size:16px;color:#fff;animation-delay:1.5s}
.paw{right:22%;top:12%;font-size:19px;color:#d99bb5;animation-delay:2.2s}

.sparkle{
    position:absolute;
    color:rgba(255,255,255,.85);
    font-size:17px;
    animation:sparkle 2.7s ease-in-out infinite;
}
.s1{left:6%;top:48%}
.s2{right:6%;top:56%;animation-delay:.9s}
.s3{left:47%;top:8%;animation-delay:1.4s}
.s4{right:37%;bottom:8%;animation-delay:2s}

@keyframes sparkle{
    0%,100%{opacity:.25;transform:scale(.7) rotate(0)}
    50%{opacity:1;transform:scale(1.3) rotate(25deg)}
}

/* Main content */
.content{
    width:min(950px,94vw);
    height:min(700px,92vh);
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Puppy scene */
.puppy-area{
    width:min(410px,44%);
    height:100%;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:25px;
}

.puppy-glow{
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(255,255,255,.38);
    filter:blur(20px);
    bottom:40px;
}

.puppy{
    width:100%;
    max-width:380px;
    max-height:570px;
    object-fit:contain;
    position:relative;
    z-index:2;
    filter:drop-shadow(0 18px 22px rgba(111,73,100,.17));
    animation:puppyFloat 3.6s ease-in-out infinite;
}

@keyframes puppyFloat{
    0%,100%{transform:translateY(5px) rotate(-1deg)}
    50%{transform:translateY(-11px) rotate(1deg)}
}

.puppy-heart{
    position:absolute;
    z-index:3;
    right:18%;
    top:27%;
    font-size:28px;
    animation:heartPop 1.7s ease-in-out infinite;
}

@keyframes heartPop{
    0%,100%{transform:scale(.8);opacity:.65}
    50%{transform:scale(1.15);opacity:1}
}

/* Letter card */
.letter-side{
    width:min(530px,58%);
    position:relative;
}

.note{
    position:relative;
    padding:42px 42px 37px;
    background:rgba(255,251,246,.94);
    border-radius:28px 24px 32px 22px;
    box-shadow:
        0 28px 65px rgba(113,77,112,.16),
        0 5px 0 rgba(255,255,255,.55) inset;
    transform:rotate(1deg);
    border:2px solid rgba(235,177,197,.6);
}

.note:before{
    content:"";
    position:absolute;
    width:100px;
    height:28px;
    top:-13px;
    left:50%;
    transform:translateX(-50%) rotate(-2deg);
    background:rgba(255,188,207,.75);
    border-radius:4px;
}

.small{
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:12px;
    font-weight:800;
    color:#c487a2;
    margin-bottom:13px;
}

h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(38px,5.2vw,62px);
    line-height:.98;
    color:#714f6d;
    font-weight:700;
    margin-bottom:17px;
}

.subtitle{
    font-size:clamp(17px,2vw,21px);
    line-height:1.55;
    color:#81637b;
}

.highlight{
    display:inline-block;
    margin-top:5px;
    color:#df638a;
    font-weight:800;
}

/* Envelope */
.envelope-wrap{
    margin-top:25px;
    display:flex;
    align-items:center;
    gap:17px;
}

.envelope{
    width:150px;
    height:100px;
    position:relative;
    cursor:pointer;
    transform:rotate(-3deg);
    transition:transform .25s ease;
    filter:drop-shadow(0 12px 15px rgba(111,73,100,.15));
}

.envelope:hover{
    transform:rotate(-3deg) translateY(-5px) scale(1.04);
}

.env-back{
    position:absolute;
    inset:0;
    background:#f5a9bd;
    border-radius:10px;
}

.env-left{
    position:absolute;
    left:0;
    bottom:0;
    border-style:solid;
    border-width:50px 75px 0 0;
    border-color:#ec8faa transparent transparent transparent;
    z-index:2;
}

.env-right{
    position:absolute;
    right:0;
    bottom:0;
    border-style:solid;
    border-width:0 75px 50px 0;
    border-color:transparent #e98aa9 transparent transparent;
    z-index:2;
}

.env-bottom{
    position:absolute;
    left:0;
    bottom:0;
    border-style:solid;
    border-width:0 0 50px 75px;
    border-color:transparent transparent #f19ab2 transparent;
    z-index:3;
}

.env-flap{
    position:absolute;
    left:0;
    top:0;
    border-style:solid;
    border-width:50px 75px 0 75px;
    border-color:#f8b5c8 transparent transparent transparent;
    transform-origin:top;
    transition:transform .6s ease;
    z-index:5;
}

.envelope.open .env-flap{
    transform:rotateX(180deg);
}

.letter{
    position:absolute;
    width:125px;
    height:85px;
    left:13px;
    bottom:8px;
    background:#fffdf8;
    border-radius:6px;
    z-index:1;
    transition:transform .7s ease;
    padding:9px;
    text-align:center;
    font-size:10px;
    color:#8d687d;
}

.envelope.open .letter{
    transform:translateY(-57px);
    z-index:4;
}

.letter b{
    color:#dc648b;
    display:block;
    margin-bottom:5px;
}

.click-note{
    color:#a7758e;
    font-size:14px;
    line-height:1.4;
}

.click-note strong{
    display:block;
    color:#d85d86;
    font-size:16px;
}

/* Secret message after envelope */
.secret{
    display:none;
    margin-top:20px;
    padding:14px 18px;
    background:#fff1f6;
    border:2px dashed #edb1c7;
    border-radius:17px;
    text-align:center;
    color:#8a627d;
    animation:secretIn .65s ease both;
}

@keyframes secretIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
}

.secret b{
    color:#dc6088;
}

/* Go button */
.go{
    display:none;
    margin-top:16px;
    border:0;
    padding:13px 24px;
    border-radius:999px;
    background:linear-gradient(135deg,#f47fa2,#d991c6);
    color:#fff;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(218,105,151,.23);
    animation:buttonPop .6s ease both,buttonFloat 2s ease-in-out .6s infinite;
}

@keyframes buttonPop{
    from{opacity:0;transform:scale(.8)}
    to{opacity:1;transform:scale(1)}
}

@keyframes buttonFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
}

/* intro reveal */
.content{
    animation:contentIn 1s ease both;
}

@keyframes contentIn{
    from{opacity:0;transform:translateY(25px)}
    to{opacity:1;transform:none}
}

/* mobile */
@media(max-width:720px){
    html,body{overflow:auto}
    .page{min-height:100vh;height:auto;padding:25px 14px}
    .content{
        height:auto;
        min-height:90vh;
        flex-direction:column;
        justify-content:center;
        gap:0;
    }
    .puppy-area{
        width:100%;
        height:300px;
        padding:0;
        align-items:flex-end;
    }
    .puppy{
        width:280px;
        height:300px;
    }
    .puppy-glow{
        width:220px;height:220px;bottom:5px;
    }
    .letter-side{
        width:100%;
        max-width:560px;
    }
    .note{
        padding:32px 23px 27px;
        transform:rotate(.5deg);
    }
    h1{font-size:43px}
    .envelope-wrap{justify-content:center}
}

@media(max-width:430px){
    .puppy-area{height:250px}
    .puppy{width:235px;height:250px}
    .note{padding:30px 18px 24px}
    h1{font-size:37px}
    .subtitle{font-size:16px}
    .envelope{width:135px;height:90px}
    .letter{width:112px;height:76px}
}
</style>
</head>

<body>

<div class="page">

    <div class="float heart1">♡</div>
    <div class="float heart2">♡</div>
    <div class="float heart3">♡</div>
    <div class="float star1">✦</div>
    <div class="float star2">✧</div>
    <div class="float paw">🐾</div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">♡</div>
    <div class="sparkle s4">✦</div>

    <main class="content">

        <section class="puppy-area">

            <div class="puppy-glow"></div>

            <img
                class="puppy"
                src="images/puppy-page1.jpg"
                alt="Cute puppy"
            >

            <div class="puppy-heart">💗</div>

        </section>

        <section class="letter-side">

            <div class="note">

                <div class="small">
                    a tiny secret from Paapa ♡
                </div>

                <h1>
                    Oii... 👀
                    <br>
                    Lingesh!
                </h1>

                <p class="subtitle">
                    I made something
                    <br>
                    <span class="highlight">veryyy special for you... 💌</span>
                </p>

                <div class="envelope-wrap">

                    <div
                        class="envelope"
                        id="envelope"
                        onclick="openLetter()"
                    >
                        <div class="env-back"></div>
                        <div class="letter">
                            <b>For Lingesh ♡</b>
                            shhh... 👀
                            <br>
                            it's a secret
                        </div>
                        <div class="env-left"></div>
                        <div class="env-right"></div>
                        <div class="env-bottom"></div>
                        <div class="env-flap"></div>
                    </div>

                    <div class="click-note" id="clickNote">
                        <strong>There's a little letter...</strong>
                        Take it from the puppy 🐶
                        <br>
                        <span>click the envelope 👀</span>
                    </div>

                </div>

                <div class="secret" id="secret">
                    <b>Hehe... you found it! 👀💗</b>
                    <br>
                    But this is only the beginning...
                </div>

                <button class="go" id="goButton" onclick="goNext()">
                    Open the surprise → 💌
                </button>

            </div>

        </section>

    </main>
</div>

<script>
function openLetter(){

    const envelope = document.getElementById("envelope");

    if(envelope.classList.contains("open")) return;

    envelope.classList.add("open");

    document.getElementById("clickNote").innerHTML =
        "<strong>Hehe... you got it! 🥹</strong>Paapa left this just for you 💗";

    setTimeout(function(){
        document.getElementById("secret").style.display = "block";
        document.getElementById("goButton").style.display = "inline-block";
    },650);
}

function goNext(){
    window.location.href = "page2.html";
}
</script>

</body>
</html>
